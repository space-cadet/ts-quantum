<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ts-quantum — Interactive Quantum Simulations</title>
    <link rel="stylesheet" href="components/layout.css">
    <link rel="stylesheet" href="css/showcase.css">
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="app">
        <!-- Sidebar placeholder — loaded by layout.js -->
        <div id="sidebar"></div>
        
        <!-- Mobile overlay -->
        <div class="mobile-overlay" id="mobileOverlay"></div>
        
        <!-- Main Content -->
        <main class="main">
            <!-- Top bar placeholder -->
            <div id="topBar"></div>
            
            <div class="content" id="content">
                <!-- Demo containers injected here -->
                <div id="demo-container"></div>
            </div>
        </main>
    </div>
    
    <script src="components/layout.js"></script>
    <script>
        // Load shared components, then load the app bundle
        loadComponents([
            { id: 'sidebar', url: 'components/sidebar.html' },
            { id: 'topBar', url: 'components/top-bar.html' }
        ], function() {
            // Set page title
            var titleEl = document.getElementById('page-title');
            if (titleEl) titleEl.textContent = 'Qubit Playground';

            // Load the app bundle after components are injected
            var s = document.createElement('script');
            s.src = 'showcase-v2.bundle.js';
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
